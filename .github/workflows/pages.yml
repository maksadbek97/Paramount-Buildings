name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Проверить тесты
        run: python manage.py test
      - name: Собрать демо-версию
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py build_static --out _site/app
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Paramount Buildings</title>
          <meta http-equiv="refresh" content="0; url=app/"><a href="app/">Открыть Paramount Buildings</a>
          HTML
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
