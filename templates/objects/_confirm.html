{% load ui %}<dialog class="ob-dialog" id="obConfirm" aria-labelledby="obConfirmTitle">
  <form method="post" action="">{% csrf_token %}
    <input type="hidden" name="action" value="">
    <h3 id="obConfirmTitle"></h3>
    <p class="muted" data-text></p>
    <label class="ob-reason" data-reason hidden>Причина <span class="rq">*</span>
      <textarea name="reason" rows="3" maxlength="300" placeholder="Например: заказчик остановил финансирование"></textarea>
      <span class="err" data-err hidden>Укажите причину — она попадёт в журнал.</span>
    </label>
    <div class="ob-dialog-act">
      <button type="button" class="btn btn-ghost" data-close>Отмена</button>
      <button type="submit" class="btn btn-primary" data-ok>Подтвердить</button>
    </div>
  </form>
</dialog>
