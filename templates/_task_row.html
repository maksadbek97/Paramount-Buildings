{% load ui %}<div class="trow">
  <div class="tb"><div class="tt">{{ t.title }}</div>
    <div class="tm">{{ t.construction_object.name|default:"Общая задача" }} · {{ t.assignee|default:"без исполнителя" }}{% if t.due_date %} · <span class="{% if t.is_overdue %}bad{% endif %}">{% if t.is_overdue %}просрочено с {% else %}до {% endif %}{{ t.due_date|date:"d.m" }}</span>{% endif %}</div></div>
  <div class="ta">
    <form method="post" action="{% url 'task_done' t.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn btn-primary" title="Отметить выполненной">{% icon 'check' 16 %}<span>Выполнить</span></button></form>
    <a class="btn btn-ghost" href="{% url 'task_postpone' t.pk %}?next={{ request.path|urlencode }}" title="Перенести срок">Перенести</a>
  </div>
</div>
